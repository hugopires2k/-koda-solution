<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Koda Solution — Horas Complementares</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div id="toasts"></div>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <h1 class="login-title">Sistema de Gestão</h1>
    <p class="login-sub">Horas Complementares Acadêmicas · Koda Solution</p>
    <label>Perfil</label>
    <select id="loginRole">
      <option value="admin">Administrador</option>
      <option value="coordenador">Coordenador</option>
      <option value="aluno">Aluno</option>
    </select>
    <label>E-mail</label>
    <input id="loginEmail" type="email" placeholder="seu@email.com" value="admin@koda.com"/>
    <label>Senha</label>
    <input id="loginPassword" type="password" placeholder="••••••••" value="123456"/>
    <button class="btn-login" onclick="login()">Entrar</button>
    <button class="btn-forgot" onclick="showForgotPassword()">Esqueci minha senha</button>
    <p class="login-hint">Selecione o perfil e clique em Entrar</p>
  </div>
</div>

<!-- ESQUECI MINHA SENHA -->
<div id="forgotPage" style="display:none">
  <div class="login-card">
    <div class="login-logo">🔑</div>
    <h1 class="login-title">Recuperar Senha</h1>
    <p class="login-sub">Digite seu e-mail cadastrado para receber o link de redefinição</p>
    <label>E-mail</label>
    <input id="forgotEmail" type="email" placeholder="seu@email.com"/>
    <button class="btn-login" onclick="sendForgotPassword()">Enviar Link</button>
    <button class="btn-forgot" onclick="showLogin()">← Voltar ao login</button>
  </div>
</div>

<!-- REDEFINIR SENHA -->
<div id="resetPage" style="display:none">
  <div class="login-card">
    <div class="login-logo">🔒</div>
    <h1 class="login-title">Nova Senha</h1>
    <p class="login-sub">Crie uma nova senha para sua conta</p>
    <label>Nova Senha</label>
    <input id="resetPassword" type="password" placeholder="Mínimo 6 caracteres"/>
    <label>Confirmar Senha</label>
    <input id="resetPasswordConfirm" type="password" placeholder="Repita a senha"/>
    <button class="btn-login" onclick="submitResetPassword()">Salvar Nova Senha</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Koda Solution</div>
        <div class="brand-tag">Horas Complementares</div>
      </div>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebarAvatar">?</div>
        <div>
          <div class="user-name" id="sidebarName">—</div>
          <div class="user-role" id="sidebarRole">—</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button class="btn-logout" onclick="logout()">
          <span>🚪</span> Sair
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="mainContent"></main>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Modal</div>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
